<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실험기구 사용법 안내</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <h1>실험기구 이미지 인식 안내 서비스</h1>

    <p class="description">
        사용법을 알고 싶은 실험기구의 사진을 업로드하세요.
    </p>

    <!-- 업로드 화면 -->
    <section id="uploadSection">

        <div id="dropArea" class="upload-box">

            <p>이미지를 선택하거나 이곳에 드래그하세요.</p>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <p id="fileName"></p>

            <div id="previewArea">
                <p id="previewText">
                    선택한 이미지가 여기에 표시됩니다.
                </p>

                <img
                    id="imagePreview"
                    alt="업로드 이미지 미리보기"
                >
            </div>

            <button id="removeButton" style="display:none;">
                이미지 제거
            </button>

        </div>

        <p class="guide">
            기구 전체가 잘 보이고 배경이 단순한 사진을 사용하는 것을 권장합니다.
        </p>

        <button id="analyzeButton" disabled>
            분석하기
        </button>

    </section>


    <!-- 분석 중 화면 -->
    <section id="loadingSection" style="display:none;">

        <div class="loader"></div>

        <h2>이미지를 분석하고 있습니다.</h2>

        <p>
            실험기구의 형태와 특징을 확인하는 중입니다.
        </p>

    </section>


    <!-- 임시 결과 화면 -->
    <section id="resultSection" style="display:none;">

        <h2>분석 완료</h2>

        <p>
            다음 단계에서 실제 이미지 인식 결과를 연결할 예정입니다.
        </p>

        <button id="retryButton">
            다른 이미지 분석
        </button>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
