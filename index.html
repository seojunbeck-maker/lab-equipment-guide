<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>실험기구 이미지 인식 안내 서비스</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

<main class="container">

    <header>
        <h1>실험기구 이미지 인식 안내 서비스</h1>

        <p class="description">
            사용법을 알고 싶은 실험기구의 사진을 업로드하세요.
        </p>
    </header>


    <!-- 이미지 업로드 화면 -->
    <section id="uploadSection">

        <div
            id="dropArea"
            class="upload-box"
        >

            <h2>실험기구 이미지 업로드</h2>

            <p>
                이미지를 선택하거나 이곳에 드래그하세요.
            </p>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >

            <p id="fileName"></p>


            <div id="previewArea">

                <p id="previewText">
                    선택한 이미지가 여기에 표시됩니다.
                </p>

                <img
                    id="imagePreview"
                    alt="업로드 이미지 미리보기"
                >

            </div>


            <button
                id="removeButton"
                class="secondary-button"
                style="display:none;"
            >
                이미지 제거
            </button>

        </div>


        <div class="photo-guide">

            <strong>촬영 안내</strong>

            <p>
                기구 전체가 잘 보이고 배경이 단순한 사진을 사용하는 것을 권장합니다.
            </p>

        </div>


        <button
            id="analyzeButton"
            class="primary-button"
            disabled
        >
            이미지 분석하기
        </button>

    </section>


    <!-- 공통 로딩 화면 -->
    <section
        id="loadingSection"
        class="card"
        style="display:none;"
    >

        <div class="loader"></div>

        <h2 id="loadingTitle">
            이미지를 분석하고 있습니다.
        </h2>

        <p id="loadingMessage">
            실험기구를 확인하고 있습니다.
        </p>

    </section>


    <!-- 분석 결과 -->
    <section
        id="resultSection"
        class="card"
        style="display:none;"
    >

        <h2>분석 결과</h2>

        <p>
            가능성이 높은 실험기구 후보입니다.
        </p>


        <div id="candidateList"></div>


        <p id="lowConfidenceMessage"></p>


        <p id="selectedResult">
            선택된 기구가 없습니다.
        </p>


        <button
            id="confirmButton"
            class="primary-button"
            disabled
        >
            이 기구로 선택
        </button>


        <button
            id="retryButton"
            class="secondary-button"
        >
            다른 이미지 분석
        </button>

    </section>


    <!-- Supabase 상세 정보 -->
    <section
        id="confirmSection"
        class="card"
        style="display:none;"
    >

        <h2>실험기구 정보</h2>

        <h3 id="confirmedEquipment"></h3>


        <img
            id="equipmentImage"
            alt="실험기구 대표 이미지"
            style="display:none;"
        >


        <div id="equipmentDetails">

            <div class="detail-box">
                <h3>분야</h3>
                <p id="detailCategory"></p>
            </div>

            <div class="detail-box">
                <h3>용도</h3>
                <p id="detailPurpose"></p>
            </div>

            <div class="detail-box">
                <h3>구조</h3>
                <p id="detailStructure"></p>
            </div>

            <div class="detail-box">
                <h3>사용법</h3>
                <p id="detailUsage"></p>
            </div>

            <div class="detail-box">
                <h3>주의사항</h3>
                <p id="detailCaution"></p>
            </div>

        </div>


        <button
            id="restartButton"
            class="secondary-button"
        >
            처음으로
        </button>

    </section>


    <!-- 오류 화면 -->
    <section
        id="errorSection"
        class="error-box"
        style="display:none;"
    >

        <h2>오류</h2>

        <p id="errorMessage"></p>

        <button
            id="errorRetryButton"
            class="secondary-button"
        >
            다시 시도
        </button>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
